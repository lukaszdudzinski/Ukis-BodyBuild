name: Testy i publikacja
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testy Playwright (chromium + Mobile Chrome)
        run: npx playwright test --update-snapshots=missing
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: test-results/, if-no-files-found: ignore, retention-days: 14 }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: linux-snapshots, path: 'tests/**/*-linux.png', if-no-files-found: ignore, retention-days: 14 }
  build:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ta sama zawartość co „Deploy from branch” (Jekyll pomija node_modules/ i pliki z kropką, renderuje *.md)
      - uses: actions/jekyll-build-pages@v1
        with: { source: ./, destination: ./_site }
      - name: Sprawdź zawartość publikacji
        run: |
          for f in index.html classic.html reset.html sw.js ukis-scope.js pwa-updater.js manifest.json CHANGELOG.json libs/sqlite/sqlite3.wasm GEMINI.html; do test -f "_site/$f" || { echo "BRAK $f"; exit 1; }; done
          test ! -e _site/node_modules && test ! -e _site/.agents && test ! -e _site/.github
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
