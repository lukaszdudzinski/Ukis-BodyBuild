# Workflow repozytorium docelowego (kopiowany przez „Publikuj” z monorepo ukis).
# Publikuje zawartość gałęzi pages na GitHub Pages bez przetwarzania przez Jekyll (.nojekyll).
name: pages
on:
  push:
    branches: [pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Dwa etapy (zalecenie GitHub): przygotowanie pliku strony, potem osobne wdrożenie.
  # W jednym etapie deploy-pages czasem nie widział świeżo przesłanego pliku („Found 0 artifact(s)”, 2026-11-25).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Dive Tools ma ok. 840 MB (nagrania): domyślne 10 min nie wystarczało przy wolnym GitHub Pages (2026-11-04)
          timeout: 1500000
