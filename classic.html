<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <!-- Strona-przekierowanie po usunięciu wyglądu klasycznego (spec 11 pkt 1). Stare zakładki, ikony na ekranie
         początkowym i service worker w pamięci mogą jeszcze wskazywać na classic.html. Znacznik „z-klasycznego”
         pokaże raz komunikat o nowym wyglądzie (src/modules/wyglad/komunikatKlasyczny.js). Dane (baza, ustawienia)
         zostają bez zmian. To samo bez przekierowania robi strażnik #ui-version-guard w index.html. -->
    <script>try { localStorage.setItem('ukis.bodybuild.wyglad.z-klasycznego', '1'); localStorage.removeItem('uki-ui-version'); } catch (e) {} location.replace('index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Numer wersji (podbija go skrypt wersji przy wydaniu) -->
    <meta name="app-version" content="v2026.11.28.04">
    <meta name="theme-color" content="#070707">
    <title>Uki's BodyBuild</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #070707; color: #fff; font-family: system-ui, sans-serif; }
        a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: #e10600; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
</head>

<body>
    <a href="index.html">Przejdź do aplikacji</a>
</body>

</html>
